<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Portofolio</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        input[type="file"] { background: #222 !important; border: 1px dashed var(--accent) !important; padding: 15px !important; cursor: pointer; color: var(--text); width: 100%; border-radius: 8px; }
        input[type="file"]::file-selector-button { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-right: 15px; transition: 0.2s; }
        input[type="file"]::file-selector-button:hover { background: var(--accent-dark); }
    </style>
</head>
<body>

    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-brand">My<span>Portfolio.</span></div>
            <h1>Admin Panel</h1>
            <p class="login-desc">Login untuk mengelola konten portofolio kamu.</p>
            <button id="google-login-btn" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Login dengan Google
            </button>
            <p id="login-error" class="error-msg"></p>
        </div>
    </div>

    <div id="dashboard" class="dashboard" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">My<span>Portfolio.</span></div>
                <p class="sidebar-sub">Admin Panel</p>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-tab="profile"><span class="nav-icon">👤</span> Profile & About</button>
                <button class="nav-item" data-tab="skills"><span class="nav-icon">🎨</span> Skills</button>
                <button class="nav-item" data-tab="software"><span class="nav-icon">💻</span> Software</button>
                <button class="nav-item" data-tab="projects"><span class="nav-icon">🖼️</span> Projects & Video</button>
                <button class="nav-item" data-tab="contact"><span class="nav-icon">📧</span> Contact</button>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <span class="user-label">Login sebagai:</span>
                    <span class="user-email" id="user-email"></span>
                </div>
                <div class="sidebar-actions">
                    <button id="logout-btn" class="btn-sidebar btn-danger">Logout</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h1 id="page-title">Profile & About</h1>
                <a href="index.html" target="_blank" class="btn-preview">Lihat Web ↗</a>
            </header>

            <section class="tab-content active" id="tab-profile">
                <form id="form-profile">
                    <div class="form-section">
                        <h2>Hero / Cover</h2>
                        <div class="form-group"><label>Nama Lengkap</label><input type="text" id="profile-name"></div>
                        <div class="form-group"><label>Greeting</label><input type="text" id="profile-greeting"></div>
                        <div class="form-group"><label>Subtitle</label><input type="text" id="profile-title"></div>
                        <div class="form-group"><label>Deskripsi Singkat</label><textarea id="profile-description" rows="3"></textarea></div>
                    </div>
                    <div class="form-section">
                        <h2>About Me</h2>
                        <div class="form-group"><label>Teks About</label><textarea id="profile-about-text" rows="6"></textarea></div>
                        <div class="form-group">
                            <label>Upload Foto Profil (Dari Komputer)</label>
                            <input type="file" id="profile-image-file" accept="image/*">
                            <div style="margin-top: 5px; font-size: 0.8rem; color: #888;">Atau masukkan URL manual di bawah:</div>
                            <input type="text" id="profile-image" style="margin-top: 8px;">
                            <div class="img-preview" id="profile-image-preview"></div>
                        </div>
                    </div>
                    <button type="submit" class="btn-save">💾 Simpan Profile</button>
                </form>
            </section>

            <section class="tab-content" id="tab-skills">
                <div class="form-section">
                    <h2>Skills</h2>
                    <div id="skills-list" class="list-container"></div>
                    <button type="button" id="add-skill-btn" class="btn-add">+ Tambah Skill</button>
                    <button type="button" id="save-skills-btn" class="btn-save">💾 Simpan Skills</button>
                </div>
            </section>

            <section class="tab-content" id="tab-software">
                <div class="form-section">
                    <h2>Software / Tools</h2>
                    <div id="software-list" class="list-container"></div>
                    <button type="button" id="add-software-btn" class="btn-add">+ Tambah Software</button>
                    <button type="button" id="save-software-btn" class="btn-save">💾 Simpan Software</button>
                </div>
            </section>

            <section class="tab-content" id="tab-projects">
                <div class="form-section">
                    <h2>Projects & Video</h2>
                    <div id="projects-list" class="list-container"></div>
                    <button type="button" id="add-project-btn" class="btn-add">+ Tambah Project</button>
                    <button type="button" id="save-projects-btn" class="btn-save">💾 Simpan Projects</button>
                </div>
            </section>

            <section class="tab-content" id="tab-contact">
                <form id="form-contact">
                    <div class="form-section">
                        <h2>Contact</h2>
                        <div class="form-group"><label>Email (Untuk tombol Contact Me)</label><input type="email" id="contact-email"></div>
                        <div class="form-group"><label>Instagram (URL)</label><input type="url" id="contact-instagram"></div>
                        <div class="form-group"><label>GitHub (URL)</label><input type="url" id="contact-github"></div>
                        <div class="form-group"><label>WhatsApp (URL)</label><input type="url" id="contact-whatsapp"></div>
                    </div>
                    <div class="form-section">
                        <h2>Footer</h2>
                        <div class="form-group"><label>Teks Footer</label><input type="text" id="contact-footer"></div>
                    </div>
                    <button type="submit" class="btn-save">💾 Simpan Contact</button>
                </form>
            </section>
        </main>
    </div>
    <div id="toast" class="toast"></div>
    <script type="module" src="admin.js"></script>
</body>
</html>
