<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | Portofolio</title>
    
    <!-- Favicon (Logo di Tab Browser) -->
    <link rel="icon" type="image/jpeg" href="https://i.pinimg.com/1200x/37/d2/c1/37d2c142a9b10254f9fcddb2b4d6b6f0.jpg">
    
    <link rel="stylesheet" href="portofolio.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .project-detail-container { max-width: 900px; margin: 120px auto 60px; padding: 40px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
        .project-detail-image { width: 100%; max-height: 500px; object-fit: cover; border-radius: 8px; margin-bottom: 20px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-container iframe, .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #000; }
    </style>
</head>
<body style="background: var(--bg);">

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="preloader-content">
            <img src="https://i.pinimg.com/1200x/37/d2/c1/37d2c142a9b10254f9fcddb2b4d6b6f0.jpg" id="preloader-logo" alt="Ghazi Logo" style="border-radius: 50%;">
            <div class="preloader-text">0%</div>
            <div class="preloader-bar"><div class="preloader-bar-fill"></div></div>
        </div>
    </div>

    <div class="project-detail-container" id="project-content">
        <h1 style="font-family: var(--font-heading); color: var(--accent); text-align: center;">Memuat data...</h1>
    </div>
    
    <!-- GSAP Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script type="module" src="project.js"></script>
</body>
</html>
