<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects | Portofolio</title>
    
    <!-- Memanggil CSS Utama -->
    <link rel="stylesheet" href="portofolio.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body style="padding-top: 80px;">

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">My<span>Portfolio.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="projects.html" class="active">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
            <button class="menu-toggle" id="menuToggle" aria-label="Buka menu">☰</button>
        </nav>
    </header>

    <!-- ===== SECTION PROJECTS ===== -->
    <section id="projects" class="section projects" style="min-height: 100vh;">
        <p class="section-label">MY RECENT WORK</p>
        <h2 class="slide-title">Featured Projects</h2>
        
        <!-- WADAH INI SANGAT PENTING (Jangan diubah ID-nya) -->
        <div id="all-projects-container">
            <h3 style="text-align:center; color:var(--muted);">Memuat Projects...</h3>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© <span id="year"></span> M Ghazi Fawwaz. All rights reserved.</p>
    </footer>

    <!-- PENTING: Memanggil projects.js (pakai s) dengan type="module" -->
    <script type="module" src="projects.js"></script>
    
    <!-- Script kecil untuk menu mobile dan tahun otomatis -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.querySelector('.nav-links');
        
        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                menuToggle.textContent = navLinks.classList.contains('active') ? '✕' : '☰';
            });
        }
        
        const yearEl = document.getElementById('year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();
    </script>
</body>
</html>
